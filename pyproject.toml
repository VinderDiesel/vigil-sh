[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-sh"
version = "0.1.0"
description = "Turn agent executions into replayable, scoreable, gateable reliability assets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vigil Contributors" }]
keywords = ["agent", "evaluation", "reliability", "replay", "ci", "llm-observability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/VinderDiesel/vigil-sh"
Documentation = "https://github.com/VinderDiesel/vigil-sh/tree/main/docs"
Repository = "https://github.com/VinderDiesel/vigil-sh"
Changelog = "https://github.com/VinderDiesel/vigil-sh/blob/main/CHANGELOG.md"
Issues = "https://github.com/VinderDiesel/vigil-sh/issues"

[project.scripts]
vigil = "vigil.cli:main"

# ---------------------------------------------------------------------------
# Plugin entry points. Built-ins are declared here exactly like third-party
# plugins: no short-cuts, no hidden privileged path.
# ---------------------------------------------------------------------------
[project.entry-points."vigil.collectors"]
file = "vigil.plugins.collector_file:FileCollector"
otel = "vigil.plugins.collector_otel:OTelCollector"

[project.entry-points."vigil.minimizers"]
default = "vigil.plugins.minimizer_default:DefaultMinimizer"

[project.entry-points."vigil.selectors"]
rules = "vigil.plugins.selector_rules:RulesSelector"

[project.entry-points."vigil.environments"]
noop = "vigil.plugins.env_noop:NoopEnvironment"

[project.entry-points."vigil.scorers"]
exact = "vigil.plugins.scorer_exact:ExactScorer"
contains = "vigil.plugins.scorer_exact:ContainsScorer"

[project.entry-points."vigil.gates"]
hard = "vigil.plugins.gate_hard:HardGate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance"]
addopts = "-q --strict-markers"
markers = [
    "conformance: plugin SPI conformance tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/vigil"]
