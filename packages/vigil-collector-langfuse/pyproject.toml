[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-collector-langfuse"
version = "0.1.0"
description = "Vigil collector plugin: Langfuse export files and the Langfuse public API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vigil Contributors" }]
dependencies = ["vigil-sh>=0.1.0"]

[project.optional-dependencies]
api = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Tier: maintained. Separate distribution because API mode needs an HTTP
# client, which must never enter vigil core (HARD-1 / HARD-4).
[project.entry-points."vigil.collectors"]
langfuse = "vigil_collector_langfuse:LangfuseCollector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# EXE002: the sandbox filesystem keeps files mode 777; a shebang on a package
# __init__ would be worse than the warning.
ignore = ["EXE002"]
