site_name: Vigil
site_description: Turn one agent execution into a replayable, scoreable, gateable reliability asset
site_url: https://vinderdiesel.github.io/vigil-sh/
repo_url: https://github.com/VinderDiesel/vigil-sh
repo_name: VinderDiesel/vigil-sh

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
  palette:
    - scheme: default
      primary: slate
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  alternate:
    - name: English
      link: /vigil-sh/
      lang: en
    - name: 简体中文
      link: /vigil-sh/zh/
      lang: zh

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - toc:
      permalink: true

plugins: []

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Reliability handbook: reliability-handbook.md
  - Roadmap: roadmap.md
  - 简体中文:
    - 首页: zh/index.md
    - 架构: zh/architecture.md
    - 可靠性手册: zh/reliability-handbook.md
    - 路线图: zh/roadmap.md
